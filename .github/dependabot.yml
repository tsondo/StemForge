version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One combined PR per week instead of one PR per action.
    groups:
      github-actions:
        patterns:
          - "*"
  # PRs the Ace-Step-Wrangler submodule pointer forward when its main moves.
  # The nested vendor/ACE-Step-1.5 submodule is managed by the Wrangler repo.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
