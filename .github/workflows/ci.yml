name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Guard against pyproject.toml / uv.lock drift.
  lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv lock --check

  # Resolve-only checks of the non-CUDA variants — they keep pyproject.toml.ROCM
  # and pyproject.toml.MAC from silently desynchronizing when the main pyproject
  # changes.  No install; just proves each dependency graph still resolves.
  # The macOS graph resolves from Linux because the variant pins its target
  # environment to darwin/arm64, so uv never consults the host platform.
  variant-resolve:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [pyproject.toml.ROCM, pyproject.toml.MAC]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Check variant dependency parity
        run: uv run --no-project --with pytest pytest -q tests/test_pyproject_variants.py
      - name: Resolve ${{ matrix.variant }}
        run: |
          cp ${{ matrix.variant }} pyproject.toml
          uv lock

  # Full install + the pytest-style test files.  Runners are CPU-only, so
  # CUDA is hidden explicitly; the CUDA wheels install fine without a GPU.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libfluidsynth3 fluid-soundfont-gm
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Sync environment
        run: uv sync
        env:
          UV_NO_CACHE: "1"  # CUDA wheels are large; don't keep a second copy on disk
      - name: Run tests
        run: >
          uv run pytest -q
          tests/test_endpoint_docs.py
          tests/test_pyproject_variants.py
          tests/test_hf_hub.py
          tests/test_cli_args.py
          tests/test_midi_events.py
          tests/test_midi_render.py
          tests/test_midi_io_drum.py
          tests/test_midi_io_format0.py
          tests/test_midi_pipeline_drum_routing.py
          tests/test_compose_backend.py
          tests/test_gpu_scheduler.py
          tests/test_vocal_midi_pipeline.py
          tests/test_vp_mode.py
        env:
          CUDA_VISIBLE_DEVICES: ""
